name: .Net CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup .Net
        uses: actions/setup-dotnet@V4
        with:
          dotnet-version: 8.0.0.x

      - name: restore dependencies 
        run: dotnet restore DevOpsCICDTraining.Tests/DevOpsCICDTraining.Tests.csproj

      - name: build
        run: dotnet build DevOpsCICDTraining.Tests/DevOpsCICDTraining.Tests.csproj  --no-restore

      - name: test
        run: dotnet test DevOpsCICDTraining.Tests/DevOpsCICDTraining.Tests.csproj --no-build --no-restore
